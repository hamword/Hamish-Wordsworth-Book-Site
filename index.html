<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: Arial, sans-serif;
    color: #222;
    overflow: hidden;
}

body { background: #fff; }

.page {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
}

.watermark {
    position: fixed;
    inset: 0;
    background-image: url("Series/World Animal Tales Logo.png"), url("Series/World Animal Tales Logo.png"), url("Series/World Animal Tales Logo.png");
    background-repeat: no-repeat, no-repeat, no-repeat;
    background-position: left 90%, center 90%, right 90%;
    background-size: 500px 500px, 500px 500px, 500px 500px;
    filter: saturate(65%);
    opacity: 0.25;
    pointer-events: none;
    z-index: 0;
}

.content {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 8px 18px 0;
}

header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 150px;
    flex-shrink: 0;
}

.author-side,
.logo-side {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.author-photo {
    width: 150px;
    height: 150px;
    object-fit: cover;
    border-radius: 50%;
    flex-shrink: 0;
}

.author-name,
.logo-name {
    text-align: center;
    margin-top: 8px;
    font-size: 18px;
    font-weight: 600;
}

.statement {
    font-size: 22px;
    font-weight: 600;
    line-height: 1.3;
    max-width: 700px;
    text-align: center;
}

.logo {
    width: 150px;
    height: 150px;
    object-fit: contain;
    flex-shrink: 0;
}

.language-option,
.book-option,
.site-option {
    display: flex;
    align-items: center;
    gap: 5px;
    font-weight: 600;
    cursor: pointer;
}

input[type="radio"] {
    cursor: pointer;
    margin: 0;
}

#selectionArea {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 35px;
    flex: 1;
    min-height: 0;
    margin-top: 150px;
}

.selection-column {
    min-width: 210px;
    max-width: 330px;
}

.selection-column.book-column {
    min-width: 300px;
}

.column-list {
    display: flex;
    flex-direction: column;
    gap: 1px;
}

.book-option {
    line-height: 1.25;
    margin: 0;
    padding: 1px 0;
}

.language-list,
.site-list {
    display: grid;
    grid-template-columns: repeat(2, minmax(100px, 1fr));
    gap: 3px 14px;
}


/* =========================================================
   WORLD ANIMAL TALES SERIES LANGUAGE MENU
   ========================================================= */

.series-menu {
    position: relative;
    display: inline-block;
}

.series-logo-button {
    border: none;
    background: transparent;
    padding: 0;
    margin: 0;
    cursor: pointer;
}

.series-logo-button:hover .logo {
    transform: scale(1.03);
}

.series-language-menu {
    display: none;
    position: absolute;
    top: 100%;
    right: 0;
    min-width: 190px;
    background: white;
    border-radius: 10px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.18);
    padding: 8px;
    z-index: 1000;
}

.series-language-menu a {
    display: block;
    padding: 9px 12px;
    color: #444;
    text-decoration: none;
    border-radius: 6px;
    font-size: 15px;
    white-space: nowrap;
}

.series-language-menu a:hover {
    background: #f0f0f0;
}

.series-language-menu.show {
    display: block;
}

.hidden {
    display: none !important;
}

.special-thanks {
    flex-shrink: 0;
    margin-top: 0;
    padding: 5px 0 8px;
    text-align: center;
    font-size: 13px;
    line-height: 1.2;
}
</style>
</head>

/* =========================================================
   BOOK LANGUAGE NAMES
   The website is permanently displayed in English.
   Two-letter language codes are never shown to the customer.
   ========================================================= */

const languageNames = {
    en: "English",
    hi: "Hindi",
    es: "Spanish",
    fr: "French",
    pt: "Portuguese",
    ar: "Arabic",
    zh: "Traditional Chinese",
    de: "German",
    ja: "Japanese",
    it: "Italian",
    nl: "Dutch",
    af: "Afrikaans"
};

/* =========================================================
   AMAZON SITES
   ========================================================= */

const amazonSites = [
    { code:"us", name:"US", domain:"amazon.com" },

    { code:"uk", name:"UK", domain:"amazon.co.uk" },

    { code:"de", name:"Germany", domain:"amazon.de" },

    { code:"fr", name:"France", domain:"amazon.fr" },

    { code:"es", name:"Spain", domain:"amazon.es" },

    { code:"it", name:"Italy", domain:"amazon.it" },

    { code:"ca", name:"Canada", domain:"amazon.ca" },

    { code:"mx", name:"Mexico", domain:"amazon.com.mx" },

    { code:"au", name:"Australia", domain:"amazon.com.au" },

    { code:"in", name:"India", domain:"amazon.in" }
];

/* =========================================================
   PAGE TEXT
   ========================================================= */


/* =========================================================
   STATE
   ========================================================= */

let selectedBook = null;
let selectedBookLanguage = null;



/* =========================================================
   HELPERS
   ========================================================= */

function getBookIds() {
    return [...new Set(books.map(b => b.book))];
}

function getBookRecords(bookId) {
    return books.filter(b => b.book === bookId);
}

function getBookDisplayTitle(bookId) {

    const records = getBookRecords(bookId);

    const english = records.find(
        record => record.lang === "en"
    );

    if (english) {
        return english.title;
    }

    return records[0]
        ? records[0].title
        : bookId;
}

function getLanguageName(code) {
    return languageNames[code] || code;
}

/* =========================================================
   BOOK TITLES
   ========================================================= */

function renderBooks() {
    const container = document.getElementById("bookList");
    container.innerHTML = "";

    getBookIds().forEach(bookId => {
        const label = document.createElement("label");
        label.className = "book-option";

        const radio = document.createElement("input");
        radio.type = "radio";
        radio.name = "book";
        radio.value = bookId;
        radio.checked = selectedBook === bookId;

        radio.addEventListener("change", () => {
            if (!radio.checked) return;

            selectedBook = bookId;
            selectedBookLanguage = null;

            renderBookLanguages();
            hideSites();
        });

        label.appendChild(radio);
        label.appendChild(
            document.createTextNode(
                getBookDisplayTitle(bookId)
            )
        );

        container.appendChild(label);
    });
}

/* =========================================================
   BOOK LANGUAGES
   ========================================================= */

function renderBookLanguages() {
    const column = document.getElementById("bookLanguageColumn");
    const container = document.getElementById("bookLanguageList");

    container.innerHTML = "";

    if (!selectedBook) {
        column.classList.add("hidden");
        return;
    }

    const records = getBookRecords(selectedBook);

    records.forEach(record => {
        const label = document.createElement("label");
        label.className = "language-option";

        const radio = document.createElement("input");
        radio.type = "radio";
        radio.name = "bookLanguage";
        radio.value = record.lang;
        radio.checked = selectedBookLanguage === record.lang;

        radio.addEventListener("change", () => {
            if (!radio.checked) return;

            selectedBookLanguage = record.lang;
            renderSites();
        });

        label.appendChild(radio);
        label.appendChild(
            document.createTextNode(getLanguageName(record.lang))
        );

        container.appendChild(label);
    });

    column.classList.remove("hidden");
}

/* =========================================================
   AMAZON SITES
   ========================================================= */

function renderSites() {
    const column = document.getElementById("siteColumn");
    const container = document.getElementById("siteList");

    container.innerHTML = "";

    if (!selectedBook || !selectedBookLanguage) {
        column.classList.add("hidden");
        return;
    }

    amazonSites.forEach(site => {
        const label = document.createElement("label");
        label.className = "site-option";

        const radio = document.createElement("input");
        radio.type = "radio";
        radio.name = "amazonSite";
        radio.value = site.code;

        radio.addEventListener("change", () => {
            if (!radio.checked) return;

            const record = books.find(
                b => b.book === selectedBook &&
                     b.lang === selectedBookLanguage
            );

            if (!record) return;

            /* FINAL AMAZON URL IS ASSEMBLED HERE */
            const url =
                "https://" +
                site.domain +
                "/dp/" +
                record.asin;

            window.location.href = url;
        });

        label.appendChild(radio);

        const siteName =
            site.name;

        label.appendChild(document.createTextNode(siteName));
        container.appendChild(label);
    });

    column.classList.remove("hidden");
}

function hideSites() {
    const column = document.getElementById("siteColumn");
    const container = document.getElementById("siteList");

    container.innerHTML = "";
    column.classList.add("hidden");
}

/* =========================================================
   FIXED ENGLISH PAGE TEXT
   ========================================================= */

function renderText() {

    document.getElementById("statement").textContent =
        "I believe that every Parent and child-reader alike, should be given the pleasure to read in their own language.";

    document.getElementById("specialThanks").textContent =
        "Special Thanks — With special thanks to Hamish Wordsworth for allowing me to recycle this website. As a special thank-you, his children's books are also featured on this page.";
}


/* =========================================================
   FULL RENDER
   ========================================================= */

function renderAll() {
    renderText();
    renderBooks();
    renderBookLanguages();

    if (selectedBook && selectedBookLanguage) {
        renderSites();
    } else {
        hideSites();
    }
}

/* =========================================================
   RETURN FROM AMAZON
   =========================================================
   Keep page language.
   Clear book/language/site selections.
   ========================================================= */

function resetBookSelection() {
    selectedBook = null;
    selectedBookLanguage = null;

    renderBooks();
    document.getElementById("bookLanguageColumn").classList.add("hidden");
    document.getElementById("siteColumn").classList.add("hidden");
}

window.addEventListener("pageshow", function() {
    selectedBook = null;
    selectedBookLanguage = null;
    renderAll();
});

/* =========================================================
   WORLD ANIMAL TALES SERIES LANGUAGE MENU
   ========================================================= */

function toggleSeriesLanguages() {

    const menu =
        document.getElementById("seriesLanguageMenu");

    menu.classList.toggle("show");
}


/* Close menu when clicking elsewhere */

document.addEventListener("click", function(event) {

    const menu =
        document.getElementById("seriesLanguageMenu");

    const button =
        document.querySelector(".series-logo-button");

    if (
        menu &&
        button &&
        !menu.contains(event.target) &&
        !button.contains(event.target)
    ) {
        menu.classList.remove("show");
    }

});
/* =========================================================
   START
   ========================================================= */

renderAll();
